<!doctype html>
<html lang="cs" class="g92-game">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dots – Živé barevné tečky</title>
    <meta name="description" content="Simulace „particle life“: barevné tečky, jedna matice sil a z ní samovolně vznikají buňky, hadi, oběžnice i lov." />
    <link rel="icon" href="/dots/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/dots/apple-touch-icon.png" />
    <meta name="theme-color" content="#14b8a6" />
    <meta property="og:title" content="Dots – Živé barevné tečky" />
    <meta property="og:description" content="Z jedné matice sil samovolně vznikají buňky, hadi i lov. Hraj si s umělým životem." />
    <script>
      // avoid a white flash before the kit applies the theme
      try {
        var t = JSON.parse(localStorage.getItem('g92:settings') || '{}').theme;
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="g92-app dots">
    <g92-appbar app="dots" fullscreen help keys></g92-appbar>
    <main class="stage" id="stage">
      <canvas id="field" role="img" aria-label="Simulace částicového života. Drž myš nebo prst na plátně a částice se rozprchnou."></canvas>
      <noscript><p class="noscript">Dots potřebuje zapnutý JavaScript.</p></noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
